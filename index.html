<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp Portal</title>
</head>

<body>
    <h3>Sign Up Portal</h3>
    <form id="signupForm">
        <div class="form-group">
            <label for="username">Username: </label>
            <input type="text" id="username" name="username" placeholder="e.g Khaviso" required>
            <span id="usernameError" class="error"></span>
        </div>
      
        <div class="form-group">
            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            <span id="emailError" class="error"></span>
        </div>
       
        <div class="form-group">
            <label for="password">Password: </label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required>
            <span id="passwordError" class="error"></span>
        </div>
    
        <input type="checkbox" id="terms" name="terms">
        <label for="terms">I agree to terms and conditions.</label><br><br>
        <button type="submit" id="signup">Sign Up</button>
        <button type="button" id="resendVerification">Resend Verification</button>
    </form>
</body>
<script src="validation.js">
</script>

</html>
